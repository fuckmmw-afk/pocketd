# The Xcode project is generated, not committed. A .xcodeproj is a merge-conflict
# generator that hides its own diffs; this file is the reviewable source of truth.
# Run `xcodegen generate` (or `make app`) after changing it.
name: Pocketd

options:
  bundleIdPrefix: dev.pocketd
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  PocketdKit:
    path: .
  # By revision, not by version, and that is forced rather than chosen.
  # LocalLLMClientLlama passes -Xlinker rpath flags through to llama.cpp, and
  # SwiftPM refuses to let a *version*-based dependency carry unsafe flags:
  #
  #   error: The package product 'LocalLLMClientLlama-product' cannot be used
  #   as a dependency of this target because it uses unsafe build flags.
  #
  # `from: 0.5.0` therefore could not build the app target from a clean
  # checkout at all — the only reason it ever worked here was a derived-data
  # directory resolved before the rule bit, and deleting that took the app
  # build with it. A revision requirement lifts the restriction, and this SHA
  # *is* 0.5.0, so what gets compiled has not moved. It is also the stronger
  # pin the comments elsewhere already claimed this was.
  LocalLLMClient:
    url: https://github.com/tattn/LocalLLMClient.git
    revision: edc39ef2ffc1cef9cf856b0788de8d331f776c2e
  # Linked in EVERY configuration, including Debug, even though a Debug build
  # sends nothing. The alternative — linking only for Release — would mean the
  # transmitting code path is never compiled by anyone working on the app, and
  # the first build that compiles it would be the archive. MixpanelAnalytics.swift
  # makes the same argument about the `canImport` branch it already had:
  # wiring is the part that rots, and wiring compiled in both configurations
  # cannot. What Debug does instead is not CONSTRUCT it — see AnalyticsForBuild.
  Mixpanel:
    url: https://github.com/mixpanel/mixpanel-swift.git
    exactVersion: 4.4.0
  # The Jinja engine LocalLLMClient renders chat templates with, named here
  # because the app now renders one itself: the Anthropic route's prompts carry
  # client tools and tool calls, which LocalLLMClient has no way to take. Same
  # URL and the same lower bound as LocalLLMClient's own requirement, so the
  # two resolve to one copy — a second URL for the same package is an identity
  # conflict SwiftPM refuses.
  Jinja:
    url: https://github.com/huggingface/swift-jinja
    from: 2.3.5

# Project-wide, and it has to be project-wide rather than on the app target.
#
# `make device-install BUNDLE_ID=x` puts settings on the xcodebuild command
# line, which applies them to EVERY target in the graph — so overriding
# PRODUCT_BUNDLE_IDENTIFIER directly would build the app and its widget
# extension as the same identifier. An extension's identifier must be prefixed
# by its host's AND differ from it; two targets sharing one fails the build with
# "Embedded binary's bundle identifier is not prefixed with the parent app's",
# which names neither target.
#
# Defining it on the app target instead is the mistake this comment is here to
# stop being made twice: the extension cannot see another target's settings, so
# `$(POCKETD_BUNDLE_ID).Widgets` resolved to the literal string ".Widgets" and
# failed with the same message for the opposite reason.
settings:
  base:
    POCKETD_BUNDLE_ID: dev.pocketd.app

targets:
  Pocketd:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      # Compiled into this target AND into PocketdWidgets. The Live Activity's
      # attributes have to be one type in both processes or the system cannot
      # match the app's activity to the extension's UI for it.
      - path: App/Shared
      # Named as one file rather than adding App/Resources wholesale. That
      # directory also holds Info.plist and the two .entitlements files, and
      # copying those in would ship the entitlements as a readable resource and
      # give the target a second Info.plist competing with the generated one.
      #
      # App Store Connect looks for the manifest at the root of the .app, which
      # is where a plain resource copy puts it. Get this wrong and nothing
      # fails locally — the app builds, installs and runs — and the first sign
      # is ITMS-91053 rejecting the upload.
      - path: App/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Named explicitly for the same reason, and it must be the catalogue
      # rather than the PNG: an app icon copied in as a loose resource is not
      # an app icon, it is a file in the bundle, and the home screen shows the
      # grey placeholder.
      - path: App/Resources/Assets.xcassets
      # Pocketd Pro's product for Xcode's StoreKit testing, chosen by the Run
      # scheme below. In the project so Xcode can open and edit it, and in no
      # build phase: it is a test fixture, and the App Store sells the real
      # product from App Store Connect.
      - path: App/Resources/Pocketd.storekit
        buildPhase: none
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pocketd
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # The build number, as a reference rather than a literal.
        #
        # Info.plist is GENERATED from this block — editing the file directly
        # works until the next `xcodegen generate` silently puts it back, which
        # is how this was missed. Without the key here, xcodegen emits the
        # literal string 1, and `xcodebuild CURRENT_PROJECT_VERSION=<timestamp>`
        # then has nothing to bind to: the first release archive came out
        # numbered 1 despite being told otherwise.
        #
        # That failure is almost invisible, which is why it is worth a comment
        # this long. App Store Connect discards an upload whose build number it
        # already holds, and altool still exits 0 — so the symptom of a second
        # release is not an error, it is a build that never appears.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Declared here so it is answered once, in the repo, rather than as a
        # manual question in App Store Connect on every single upload — and so
        # the answer is reviewable next to the reasoning for it.
        #
        # False is the correct answer, and it is not "we do no encryption".
        # The app is a TLS *client* (Hugging Face downloads over HTTPS through
        # URLSession) and its own LAN server speaks plain HTTP. Encryption
        # reached only through Apple's own APIs is exempt under the standard
        # exemption, and nothing here ships a cryptographic implementation of
        # its own. The API key the server requires is a shared secret compared
        # in constant time, not encryption.
        ITSAppUsesNonExemptEncryption: false
        # The one URL scheme, and it exists because a widget cannot select a
        # tab. The extension is a separate process; the two ways out of one are
        # an App Intent and a URL, and `widgetURL` is the only one of those that
        # a tap on the widget's *body* can carry. `DeepLink` is the parser on
        # the other side.
        #
        # Nothing fails visibly if this block is missing: the app builds,
        # installs and runs, the widget still draws, and a tap on it simply
        # opens the app on whatever tab it was last on — iOS never routes the
        # URL, so `onOpenURL` is never called and there is no error anywhere to
        # find. That is the whole reason it is commented at this length.
        #
        # Deliberately not registered for `http`/`https`: universal links need a
        # domain, an apple-app-site-association file served from it, and an
        # associated-domains entitlement, none of which this app has and none of
        # which a home-screen tap needs. A private scheme is claimed by whoever
        # installs first and is therefore not a security boundary, which is why
        # `DeepLink` carries no payload — see the note on it.
        CFBundleURLTypes:
          - CFBundleURLName: $(POCKETD_BUNDLE_ID)
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - pocketd
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Required since iOS 14 for any app that listens on or scans the LAN.
        # Without it the listening socket accepts nothing from other devices and
        # fails silently, which is the single most confusing way for this app to
        # break.
        # Everything here is plain HTTP on a private address by design. Without
        # this exception App Transport Security blocks the app's own requests to
        # local hosts, which is how the in-app diagnostics fail on a device but
        # not in the simulator.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Full access rather than write-only, and now for both halves of the
        # word: these tools read AND write. On iOS 17+ a calendar read with only
        # NSCalendarsWriteOnlyAccessUsageDescription present returns an empty
        # list rather than an error, which looks exactly like a free day — so
        # full access was always what the reads needed, and the writes that
        # arrived later need no additional grant.
        #
        # The strings below say "add" explicitly. A purpose string that promised
        # only reading while the app created events would be false in the one
        # place a user is most entitled to a straight answer, and it is the
        # string App Review reads first.
        # The wording says where the data goes because that is the honest and
        # unusual part of this app: the reading happens on this phone, and no
        # request leaves the device to answer. Short on purpose: this is the
        # first sentence of the app most people read closely, and it arrives in
        # the middle of the intro, under a primer that already said why.
        NSCalendarsFullAccessUsageDescription: >-
          Pocketd reads your calendar to tell you what's next, and adds events
          when you ask. Your events stay on this iPhone, and other devices can't
          read them.
        NSRemindersFullAccessUsageDescription: >-
          Pocketd reads your reminders to tell you what's due, and adds or ticks
          them off when you ask. They stay on this iPhone, and other devices
          can't read them.
        # Both are required, and the app crashes on requestAuthorization if
        # either is missing — not a warning, a termination. The write string is
        # present because HealthKit demands it whenever the framework is linked,
        # even though nothing here writes: the read tools are read-only and the
        # share set passed to requestAuthorization is empty.
        NSHealthShareUsageDescription: >-
          Pocketd reads your sleep, activity and heart data to compare today with
          your usual. It stays on this iPhone, and other devices can't read it.
        NSHealthUpdateUsageDescription: >-
          Pocketd does not write to Health. This permission is requested only
          because iOS requires the description to be present whenever an app
          links HealthKit.
        # The microphone on the composer, and the two keys are not
        # interchangeable: the microphone string is what iOS shows when the
        # audio session starts, and the speech one is what it shows before
        # `SFSpeechRecognizer` runs. Ship one without the other and the app is
        # terminated at the moment somebody first holds the button.
        #
        # Both strings say where the audio goes, because that is the unusual
        # part: `requiresOnDeviceRecognition` is set, so the recogniser never
        # reaches Apple's servers — and the app hides the microphone entirely
        # rather than falling back to the network one when a device cannot do
        # it locally.
        NSSpeechRecognitionUsageDescription: >-
          Pocketd turns your voice into text on this iPhone so you can ask by
          speaking. Audio is processed on the device and never uploaded.
        NSMicrophoneUsageDescription: >-
          Pocketd listens only while the microphone is on, to hear your
          question. Nothing is recorded or sent anywhere.
        # Required to advertise over Bonjour. Without these exact service types
        # publish fails silently and the phone is discoverable by nothing.
        NSBonjourServices:
          - _pocketd._tcp
          - _ollama._tcp
        NSLocalNetworkUsageDescription: >-
          When you turn on Use from your laptop, Pocketd answers your other
          devices over your Wi-Fi. Nothing leaves your local network.
        # Background refresh, and an honest account of what it buys.
        #
        # Without `fetch` here, BGTaskScheduler refuses the app outright:
        # `submit` fails with BGTaskSchedulerErrorCodeNotPermitted and nothing
        # ever wakes. There is no crash and no log — the schedule simply never
        # runs, which is the hardest kind of broken to notice.
        #
        # What it buys is seconds of CPU and no GPU at all. That is enough for
        # a watcher, which is a sort and a template over EventKit rows, and it
        # is not enough for a prompt task and cannot be made so: a backgrounded
        # app's Metal command buffers come back notPermitted on every iPhone,
        # so no value in this array will ever let the model think while the app
        # is closed. `processing` is deliberately absent for that reason — it
        # grants minutes instead of seconds, which is minutes of a GPU nobody
        # is allowed to touch. A prompt task's due moment is kept by a
        # notification trigger, which needs no background execution whatsoever.
        UIBackgroundModes:
          - fetch
        # The one identifier, written out rather than derived, and the literal
        # has to match `BackgroundWake.refreshIdentifier` exactly.
        #
        # `register` returns false for an identifier that is not in this array
        # and reports nothing else; the app then launches normally, shows a
        # schedule, and never wakes for it. So the string is the contract, and
        # the tempting version of it — $(PRODUCT_BUNDLE_IDENTIFIER).schedule.
        # refresh — is the trap: `make device-install BUNDLE_ID=…` overrides
        # the bundle identifier on the exact build that goes on real hardware,
        # which is also the only place background refresh runs at all (the
        # simulator never fires one). The plist would move, the Swift constant
        # would not, and background refresh would be dead on devices while
        # working everywhere it cannot be tested.
        BGTaskSchedulerPermittedIdentifiers:
          - dev.pocketd.app.schedule.refresh
        # Live Activities. Declared for the model download, which is the one
        # thing this app does that is long, user-started, and genuinely
        # continues while the app is off screen — `FileDownloader` sets
        # `sessionSendsLaunchEvents`, so the bytes really do keep arriving.
        #
        # Deliberately NOT declared for the server. A Live Activity saying
        # SERVING would be false within seconds of leaving the app: iOS tears
        # the listener down on suspend, which `AppModel.serverShouldRun` exists
        # to paper over, and `autoOffloadInBackground` defaults true so the
        # model is gone too. Desk Mode is already an on-screen view, so an
        # Activity duplicating it would be a second copy of the screen you are
        # looking at — and a lie the moment you look away.
        NSSupportsLiveActivities: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: $(POCKETD_BUNDLE_ID)
        MARKETING_VERSION: "1.1.1"
        # The build number, overridden at archive time with a unix timestamp.
        # See CFBundleVersion above, which is what makes that override reach
        # the bundle at all.
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # iPhone only for 1.0, and that is a retreat from a claim the app was
        # making without evidence. "1,2" shipped iPad support that nobody has
        # ever run on an iPad: every memory assumption here is calibrated
        # against phone hardware, and the fit estimate that decides whether a
        # model is downloadable at all has never seen an iPad's jetsam limit.
        # A universal binary also makes iPad screenshots mandatory and invites
        # a reviewer to open it on hardware we have not tested, next to two
        # questions (arbitrary GGUF, local server) we would rather have their
        # full attention on. iPad is a later release with real testing behind
        # it, not a build setting.
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 83C822A4J3
        CODE_SIGN_STYLE: Automatic
        # Indirection so a device build can drop the entitlement without
        # editing this file. Overriding CODE_SIGN_ENTITLEMENTS directly on the
        # xcodebuild command line applies it to every target in the graph,
        # including LocalLLMClient's, which then fail on a path relative to the
        # wrong project. A custom variable is ignored by targets that do not
        # reference it. See `make device-install`.
        # The file is committed rather than generated: XcodeGen's entitlements:
        # block writes CODE_SIGN_ENTITLEMENTS onto the target, which then wins
        # over this indirection and makes the override below a no-op.
        POCKETD_ENTITLEMENTS: $(SRCROOT)/App/Resources/Pocketd.entitlements
        CODE_SIGN_ENTITLEMENTS: $(POCKETD_ENTITLEMENTS)
        SWIFT_STRICT_CONCURRENCY: complete
        # LocalLLMClientLlama is built with .interoperabilityMode(.Cxx), and a
        # target that links it has to agree. Without this the llama.cpp headers
        # are compiled as C and fail on `#include <memory>`, which reads as a
        # missing-file error rather than a settings mismatch. Found in
        # LocalLLMClient's own Example project, not in its README.
        SWIFT_OBJC_INTEROP_MODE: objcxx
    dependencies:
      - package: PocketdKit
        product: PocketdKit
      - package: LocalLLMClient
        product: LocalLLMClient
      - package: LocalLLMClient
        product: LocalLLMClientLlama
      - package: Mixpanel
        product: Mixpanel
      - package: Jinja
        product: Jinja
      # Embeds the widget. Without this the extension builds and is simply
      # not in the .app, which looks exactly like a widget that does not appear
      # in the gallery — a failure with no error attached to it.
      - target: PocketdWidgets
        embed: true

  PocketdWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: App/Widgets
      - path: App/Shared
      # The two files the widget shares with the app, compiled in rather than
      # linked. `PocketdKit` depends on FlyingFox, and an HTTP server has no
      # business in a process with a ~30 MB ceiling whose entire job is to read
      # one small JSON file. Both are Foundation-only for exactly this reason;
      # see the note at the bottom of SchedulePublication.swift.
      #
      # Compiling a file into two targets makes two types with one name in two
      # modules. That is fine here and only here, because these two never meet
      # as types — they meet as JSON on disk, through the App Group.
      - path: Sources/PocketdKit/Widgets/SchedulePublication.swift
      - path: Sources/PocketdKit/Widgets/SchedulePublicationStore.swift
      # The Today brief's widget mirror, split the same three ways: the type
      # and its store are Foundation-only and compiled in here; the `+Make`
      # half references PocketdKit and stays app-side.
      - path: Sources/PocketdKit/Widgets/WidgetBrief.swift
      - path: Sources/PocketdKit/Widgets/WidgetBriefStore.swift
      # The one set of on-screen formats ("9:30 AM", "in 25 min", "4,120"),
      # so a widget says a time the way the app does. Foundation-only, like
      # the four above, and compiled in for the same reason.
      - path: Sources/PocketdKit/Format/Format.swift
    info:
      path: App/Resources/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Pocketd
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        # Nested under the host, and moving with it. See POCKETD_BUNDLE_ID.
        PRODUCT_BUNDLE_IDENTIFIER: $(POCKETD_BUNDLE_ID).Widgets
        MARKETING_VERSION: "1.1.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 83C822A4J3
        CODE_SIGN_STYLE: Automatic
        # Its own indirection, so `make device-install` can drop the group for
        # a build with no portal capabilities without the extension failing to
        # sign. The store treats a missing container as a quiet no.
        POCKETD_WIDGET_ENTITLEMENTS: $(SRCROOT)/App/Resources/PocketdWidgets.entitlements
        CODE_SIGN_ENTITLEMENTS: $(POCKETD_WIDGET_ENTITLEMENTS)
        SWIFT_STRICT_CONCURRENCY: complete
        # No objcxx here, deliberately. The app needs it because it links
        # llama.cpp's C++ headers; this target links neither, and turning it on
        # would import the whole ObjC surface under C++ rules for nothing —
        # including the UNNotification quirk documented in NotificationCentre.
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

# A shared scheme, on disk and in git's view of the world.
#
# Without one, `xcodebuild -scheme Pocketd` still works — it synthesises a
# scheme in memory — but Xcode.app opens the project with an empty scheme
# picker, and anything that needs a scheme (previews, profiling, a fresh
# clone's first Run) has nothing to select. That is a worse first five
# minutes than it sounds, and it is one block of YAML.
schemes:
  Pocketd:
    build:
      targets:
        Pocketd: all
    run:
      config: Debug
      # Run from Xcode, Pocketd Pro loads from this file instead of the App
      # Store: the price, a purchase, Ask to Buy and refunds can all be tried
      # in Debug > StoreKit > Manage Transactions with no sandbox account.
      # `simctl launch` and `xcodebuild build` ignore it; see `ProStage` for
      # the simulator.
      storeKitConfiguration: App/Resources/Pocketd.storekit
    # No test targets here: the suite is the Swift package's, run with
    # `swift test`, and it deliberately does not need a simulator.
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
